<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Mont';font-weight:800;src:url(fonts/Montserrat-800.woff2)}
@font-face{font-family:'Mont';font-weight:900;src:url(fonts/Montserrat-900.woff2)}
html,body{margin:0;background:transparent}
#c{position:relative;width:1080px;height:1920px;font-family:Mont}
.t{position:absolute;left:0;right:0;text-align:center;font-weight:900;color:#fff;line-height:1.05;
  -webkit-text-stroke:14px #25212b;paint-order:stroke fill;text-shadow:0 10px 0 rgba(37,33,43,.35)}
.hl{display:inline-block;background:#ffcf3a;color:#25212b;-webkit-text-stroke:0;padding:6px 26px 10px;border:9px solid #25212b;border-radius:18px;transform:rotate(-2deg);box-shadow:0 10px 0 rgba(37,33,43,.35);text-shadow:none}
.pill{position:absolute;left:50%;transform:translateX(-50%);background:#25212b;color:#fff;font-weight:900;border-radius:999px;padding:16px 40px 18px;font-size:46px;white-space:nowrap;border:6px solid #fff}
</style></head><body><div id="c">
<div class="t" style="top:170px;font-size:104px">ALL SAINTS</div>
<div class="t" style="top:300px;font-size:84px"><span class="hl">&amp; ALL SOULS</span></div>
<div class="pill" id="part" style="top:1300px">PART 1 OF 3</div>
<div class="pill" id="foot" style="top:1420px;background:#ffcf3a;color:#25212b;border-color:#25212b">FOLLOW FOR PART 2 →</div>
</div>
<script>const q=new URLSearchParams(location.search);
document.getElementById('part').textContent=q.get('part')||'';if(!q.get('part'))document.getElementById('part').style.display='none';
document.getElementById('foot').textContent=q.get('foot')||'';if(!q.get('foot'))document.getElementById('foot').style.display='none';</script>
</body></html>
